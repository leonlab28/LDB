# Xcode-Projekt wird aus dieser Datei erzeugt (kein .xcodeproj im Repo):
#   brew install xcodegen && cd ios && xcodegen generate && open LDB.xcodeproj
name: LDB
options:
  bundleIdPrefix: de.leonlab28
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # in Xcode unter Signing & Capabilities setzen
    CODE_SIGN_STYLE: Automatic
targets:
  LDB:
    type: application
    platform: iOS
    sources: [LDB]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.leonlab28.ldb
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LDB
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dein ungefährer Ort (auf ca. 1 km gerundet) wird deinem Partner für Uhrzeit, Wetter und Minikarte angezeigt."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Für deine Sprachnachricht an deinen Partner."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
